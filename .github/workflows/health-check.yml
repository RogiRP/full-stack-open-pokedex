name: Periodic health check

on:
  push:
    branches:
      - main

jobs:
  health_check:
    runs-on: ubuntu-22.04
    steps:
      - name: Check application health
        uses: Jtalk/url-health-check-action@v4
        with:
          url: https://pokedex-rogirp.onrender.com/url-que-no-existe
          max-attempts: 3
          retry-delay: 5s
      - name: Notify Discord of failed health check
        if: failure()
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d "$(jq -n --arg msg "🚨 Health check failed! The Pokedex application at https://pokedex-rogirp.onrender.com/health is not responding correctly." '{content: $msg}')" \
            "${{ secrets.DISCORD_WEBHOOK }}"