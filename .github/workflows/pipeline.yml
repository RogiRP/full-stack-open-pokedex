name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  simple_deployment_pipeline:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '16'
      - name: npm install
        run: npm install
      - name: lint
        run: npm run eslint
      - name: build
        run: npm run build
      - name: test
        run: npm test
      - name: install playwright browsers
        run: npx playwright install --with-deps
      - name: e2e tests
        run: npm run test:e2e
        env:
          CI: true
      - name: Trigger deployment
        if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ','), '#skip') }}
        run: curl https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_API_KEY }}
      - name: Notify Discord of successful deployment
        if: ${{ success() && github.event_name == 'push' && !contains(join(github.event.commits.*.message, ','), '#skip') }}
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d "$(jq -n --arg msg "🎉 New version of the Pokedex deployed successfully! Commit ${{ github.sha }} by ${{ github.actor }}." '{content: $msg}')" \
            "${{ secrets.DISCORD_WEBHOOK }}"
      - name: Notify Discord of failed build
        if: failure()
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d "$(jq -n --arg msg "🔥 Build failed! Commit: ${{ github.sha }} | Author: ${{ github.actor }} | Branch: ${{ github.ref_name }} | Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{content: $msg}')" \
            "${{ secrets.DISCORD_WEBHOOK }}"

  tag_release:
    needs: [simple_deployment_pipeline]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: Bump version and push tag
        if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ','), '#skip') }}
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch